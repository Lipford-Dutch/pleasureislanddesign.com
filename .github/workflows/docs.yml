name: Build Docs

# Builds the MkDocs site and uploads it as a workflow artifact.
# It no longer commits to main: release notes are generated into the
# build workspace only, so this works once main is branch-protected.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install MkDocs and plugins
        run: |
          pip install \
            mkdocs==1.5.3 \
            mkdocs-material==9.5.3 \
            mkdocs-git-revision-date-localized-plugin==1.2.2 \
            mkdocs-minify-plugin==0.7.2

      - name: Generate release notes page (build-time only, not committed)
        run: |
          cp CHANGELOG.md docs/release-notes.md
          echo "" >> docs/release-notes.md
          echo "Auto-generated from CHANGELOG.md on $(date -u '+%Y-%m-%d %H:%M UTC')" >> docs/release-notes.md

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload built docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site
          retention-days: 14
