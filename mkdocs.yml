site_name: Pleasure Island Design — Technical Reference
site_url: https://lipford-dutch.github.io/pleasureislanddesign.com/
site_author: Pleasure Island Design LLC
site_description: Technical documentation, white papers, and operational guides for pleasureislanddesign.com
docs_dir: docs
exclude_docs: |
  pid/
  !pid/operations/deploy-runbook.md
  archive/

repo_name: Lipford-Dutch/pleasureislanddesign.com
repo_url: https://github.com/Lipford-Dutch/pleasureislanddesign.com
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2024 Pleasure Island Design LLC — Apache 2.0 License

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Lato
    code: Fira Code
  logo: https://www.pleasureislanddesign.com/img/pid-logo-small.jpg
  favicon: https://www.pleasureislanddesign.com/img/pid-logo-small.jpg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.action.view
    - content.code.copy
    - toc.integrate

extra_css:
  - assets/mkdocs-overrides.css

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - minify:
      minify_html: true

extra:
  social:
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/pidnrayment/
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/pleasureislanddesign/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/pleasureislanddesign/
    - icon: fontawesome/brands/github
      link: https://github.com/Lipford-Dutch/pleasureislanddesign.com

nav:
  - Home: index.md
  - White Paper:
    - Overview: whitepaper/overview.md
    - Business Model: whitepaper/business-model.md
    - Brand Guidelines: whitepaper/brand-guidelines.md
    - Service Standards: whitepaper/service-standards.md
  - Technical Reference:
    - Architecture: technical/architecture.md
    - CI/CD Pipeline: technical/cicd.md
    - Design System: technical/design-system.md
    - GitHub Pages: technical/github-pages.md
    - Deployment: technical/deployment.md
  - Operations:
    - Contributing: https://github.com/Lipford-Dutch/pleasureislanddesign.com/blob/main/CONTRIBUTING.md
    - Security: https://github.com/Lipford-Dutch/pleasureislanddesign.com/blob/main/SECURITY.md
    - Deployment Guide: https://github.com/Lipford-Dutch/pleasureislanddesign.com/blob/main/docs/archive/DEPLOYMENT.md
    - Code of Conduct: https://github.com/Lipford-Dutch/pleasureislanddesign.com/blob/main/CODE_OF_CONDUCT.md
  - Release Notes: release-notes.md
