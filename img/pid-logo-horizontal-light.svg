<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" role="img" aria-label="Pleasure Island Design">
  <title>Pleasure Island Design — horizontal lockup (for dark backgrounds)</title>
  <defs>
    <linearGradient id="pidHLSweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9DBFB8"/>
      <stop offset="0.55" stop-color="#7DA69E"/>
      <stop offset="1" stop-color="#C4973B"/>
    </linearGradient>
  </defs>

  <!-- Badge-less brush mark (reads on navy/dark) -->
  <g transform="translate(6 10)">
    <path d="M8 60 C 24 38, 44 31, 70 37 C 53 44, 44 54, 40 68 C 30 66, 18 64, 8 60 Z"
          fill="url(#pidHLSweep)"/>
    <path d="M16 44 L36 30 L45 43 L31 58 Z" fill="#F9F6F1"/>
    <rect x="37" y="23" width="14" height="9" rx="2.4" transform="rotate(41 44 27.5)" fill="#C4973B"/>
    <rect x="43" y="-2" width="9" height="33" rx="4.4" transform="rotate(41 47.5 14.5)" fill="#F9F6F1"/>
  </g>

  <!-- Reversed wordmark -->
  <g transform="translate(104 0)" font-family="'Playfair Display', Georgia, 'Times New Roman', serif">
    <text x="0" y="45" font-size="31" font-weight="700" fill="#F9F6F1" letter-spacing="0.3">Pleasure Island</text>
    <text x="2" y="73" font-size="14.5" font-weight="400" letter-spacing="8.5"
          font-family="'Lato', 'Segoe UI', Arial, sans-serif" fill="#9DBFB8">D E S I G N</text>
  </g>
</svg>
