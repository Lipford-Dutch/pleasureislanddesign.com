<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Pleasure Island Design mark">
  <title>Pleasure Island Design — mark</title>
  <defs>
    <linearGradient id="pidMarkSweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7DA69E"/>
      <stop offset="0.55" stop-color="#5B8078"/>
      <stop offset="1" stop-color="#C4973B"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="2" y="2" width="92" height="92" rx="24" fill="#1E3A5F"/>

  <!-- Bold refinishing sweep (reads at small sizes) -->
  <path d="M20 66 C 34 44, 52 37, 76 43 C 60 50, 51 59, 47 73 C 37 71, 27 69, 20 66 Z"
        fill="url(#pidMarkSweep)"/>

  <!-- Brush head -->
  <path d="M26 50 L44 37 L53 49 L40 63 Z" fill="#F9F6F1" opacity="0.96"/>

  <!-- Gold ferrule -->
  <rect x="44" y="30" width="14" height="9" rx="2.5"
        transform="rotate(41 51 34.5)" fill="#C4973B"/>

  <!-- Handle -->
  <rect x="50" y="5" width="9" height="34" rx="4.5"
        transform="rotate(41 54.5 22)" fill="#F9F6F1"/>
</svg>
