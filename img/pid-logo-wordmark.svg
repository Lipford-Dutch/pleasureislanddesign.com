<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" role="img" aria-label="Pleasure Island Design">
  <title>Pleasure Island Design — wordmark</title>
  <defs>
    <linearGradient id="pidWStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8078"/>
      <stop offset="1" stop-color="#C4973B"/>
    </linearGradient>
  </defs>

  <!-- Minimal brush accent above the wordmark -->
  <path d="M6 26 C 40 14, 120 12, 196 18" stroke="url(#pidWStroke)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
  <path d="M196 18 l 12 -5 -3 8 z" fill="#C4973B"/>

  <!-- Wordmark -->
  <g font-family="'Playfair Display', Georgia, 'Times New Roman', serif">
    <text x="4" y="58" font-size="34" font-weight="700" fill="#1E3A5F" letter-spacing="0.4">Pleasure Island</text>
    <text x="6" y="78" font-size="13.5" font-weight="400" letter-spacing="9"
          font-family="'Lato', 'Segoe UI', Arial, sans-serif" fill="#5B8078">D E S I G N</text>
  </g>
</svg>
