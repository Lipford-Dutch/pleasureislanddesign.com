<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" role="img" aria-label="Pleasure Island Design">
  <title>Pleasure Island Design — horizontal lockup</title>
  <defs>
    <linearGradient id="pidHSweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7DA69E"/>
      <stop offset="0.55" stop-color="#5B8078"/>
      <stop offset="1" stop-color="#C4973B"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(4 4)">
    <rect x="0" y="0" width="88" height="88" rx="23" fill="#1E3A5F"/>
    <path d="M18 61 C 31 41, 48 34, 70 40 C 55 46, 47 55, 43 68 C 34 66, 25 64, 18 61 Z"
          fill="url(#pidHSweep)"/>
    <path d="M24 46 L41 34 L49 45 L37 58 Z" fill="#F9F6F1" opacity="0.96"/>
    <rect x="41" y="28" width="13" height="8.5" rx="2.4" transform="rotate(41 47.5 32)" fill="#C4973B"/>
    <rect x="46" y="5" width="8.5" height="31" rx="4.2" transform="rotate(41 50 20)" fill="#F9F6F1"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(108 0)" font-family="'Playfair Display', Georgia, 'Times New Roman', serif">
    <text x="0" y="45" font-size="31" font-weight="700" fill="#1E3A5F" letter-spacing="0.3">Pleasure Island</text>
    <text x="2" y="73" font-size="14.5" font-weight="400" letter-spacing="8.5"
          font-family="'Lato', 'Segoe UI', Arial, sans-serif" fill="#5B8078">D E S I G N</text>
  </g>
</svg>
